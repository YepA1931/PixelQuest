<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>픽셀퀘스트</title>
<style>

 --bg:#090d18;--fg:#f1f4ff;--bt:#18243a;--bd:#425879;
 --gold:#f4c96b;--cyan:#72d9ed;--violet:#a98cff;
 color-scheme:dark;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*,*:before,*:after{box-sizing:border-box}
html,body{
 margin:0;min-height:100%;color:var(--fg);
 background:
 radial-gradient(ellipse at 50% 0%,rgba(56,83,135,.28),transparent 55%),
 radial-gradient(ellipse at 10% 80%,rgba(40,89,111,.12),transparent 45%),
 linear-gradient(160deg,#080c17 0%,#111a2b 48%,#080d19 100%);
 background-attachment:fixed;font-family:system-ui,-apple-system,sans-serif;
 touch-action:manipulation;overscroll-behavior:none;user-select:none;
 -webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent
}
canvas,button,#ctl,#top{touch-action:manipulation}
#c{
 display:block;width:min(100%,62vh);max-width:900px;margin:0 auto;
 image-rendering:pixelated;background:#070b14;
 border:1px solid rgba(145,184,224,.42);border-radius:13px;
 box-shadow:0 0 0 3px rgba(6,12,24,.92),0 0 0 4px rgba(115,159,207,.16),
 0 18px 44px rgba(0,0,0,.58),0 0 32px rgba(71,143,194,.12)
}
#top{
 max-width:900px;margin:0 auto;padding:12px 8px 9px;display:flex;gap:9px
}
button{
 position:relative;overflow:hidden;font:inherit;color:var(--fg);
 background:linear-gradient(180deg,#273a58 0%,#17243a 55%,#111b2d 100%);
 border:1px solid #58759a;border-radius:10px;padding:0;
 box-shadow:0 3px 0 #080f1c, inset 0 1px 0 rgba(255,255,255,.2),
 0 5px 14px rgba(0,0,0,.22);
 text-shadow:0 1px 2px #000;transition:filter .12s,transform .12s
}
button:before{
 content:"";position:absolute;inset:2px;border:1px solid rgba(177,213,246,.12);
 border-radius:7px;pointer-events:none
}
button:active{transform:translateY(2px);filter:brightness(1.2);box-shadow:0 1px 0 #080f1c}
#bs{
 height:42px;flex:1;font-size:14px;font-weight:800;letter-spacing:.04em;
 color:#ffe6a0;border-color:#9b7b43;
 background:linear-gradient(180deg,#5c482c,#342a22 60%,#211d1d)
}
#bm{
 height:42px;width:56px;font-size:19px;flex:none;
 background:linear-gradient(180deg,#29495d,#172b40)
}
#ctl{
 max-width:900px;margin:0 auto;padding:10px 9px 12px;display:grid;gap:8px;
 background:linear-gradient(180deg,rgba(15,25,43,.08),rgba(8,14,26,.72));
 border-top:1px solid rgba(130,171,213,.12)
}
.dp{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:3px 3px}
#js{
 width:132px;height:132px;flex:none;position:relative;border-radius:50%;
 background:radial-gradient(circle at 42% 36%,rgba(71,112,154,.58),rgba(21,38,63,.9) 58%,#0b1425 100%);
 border:2px solid #6b91b4;box-shadow:inset 0 0 0 5px rgba(5,12,24,.52),
 inset 0 0 22px rgba(105,175,220,.2),0 5px 18px rgba(0,0,0,.45);
 touch-action:none
}
#js:before{
 content:"";position:absolute;inset:10px;border:1px dashed rgba(176,214,243,.3);
 border-radius:50%;pointer-events:none
}
#js:after{
 content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;
 transform:translate(-50%,-50%);border-radius:50%;background:#bcecff;
 box-shadow:0 0 8px #72d9ed;pointer-events:none
}
#kn{
 position:absolute;width:54px;height:54px;left:37px;top:37px;border-radius:50%;
 background:radial-gradient(circle at 34% 27%,#f1fbff 0%,#9fc5dd 13%,#557e9e 47%,#213d5a 78%,#14243a 100%);
 border:2px solid rgba(220,242,255,.7);
 box-shadow:0 4px 9px rgba(0,0,0,.55),inset 0 2px 4px rgba(255,255,255,.45);
 pointer-events:none
}
#sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;flex:1;min-width:0}
.sk{
 height:62px;min-width:0;padding:0 2px;border-radius:9px;
 background:linear-gradient(180deg,#293d5c,#17243a 60%,#101a2b);
 border-color:#58749a;box-shadow:0 3px 0 #080f1b,inset 0 1px 0 rgba(255,255,255,.18);
}
.sk:nth-child(4n+1){border-color:#5687a9}
.sk:nth-child(4n+2){border-color:#987bba}
.sk:nth-child(4n+3){border-color:#b18b50}
.sk:nth-child(4n){border-color:#649a80}
.sk span{display:block;font-size:10px;line-height:1.18;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.sk i{display:block;font-style:normal;font-size:9px;opacity:.72;margin-top:4px}
#zoo{
 display:flex;justify-content:center;gap:12px;padding:13px 0 24px;margin:8px 8px 0;
 border-top:1px solid rgba(125,165,206,.18);
 background:linear-gradient(180deg,rgba(18,30,49,.32),transparent)

#zoo img{

}
#ov{
 display:none;position:fixed;inset:0;z-index:9;
 background:radial-gradient(ellipse at 50% 25%,rgba(45,67,108,.97),rgba(8,12,25,.985) 68%);

#ov:before{
 content:"";position:fixed;inset:10px;border:1px solid rgba(180,210,245,.18);
 border-radius:15px;pointer-events:none

#ov button{

.r{display:flex;justify-content:space-between;align-items:center;width:min(340px,92%);gap:10px}
.r button{width:46px;height:34px;font-size:18px}
.r button:disabled{opacity:.3}
.m{

 background:linear-gradient(180deg,rgba(40,57,85,.95),rgba(17,28,48,.96));
 border:1px solid rgba(156,193,230,.55);border-radius:12px;
 box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12)
}
.m small{display:block;opacity:.76;font-size:12px}
h3{margin:4px;color:#ffe3a0;text-shadow:0 2px 4px #000}
p{margin:2px}
.hp{

 background:linear-gradient(145deg,rgba(22,36,58,.94),rgba(10,19,34,.96));
 border:1px solid #526e91;border-radius:12px;padding:13px 15px;
 max-height:62vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.32)
}
.hp b{color:#ffdc83}
.glass{background:rgba(11,20,36,.72)!important;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.glass .r,.glass h3,.glass p{text-shadow:0 1px 3px #000}
.ttl{

 text-shadow:2px 2px 0 #8a5422,4px 4px 0 #342315,6px 7px 0 #050914;

.sub{opacity:.8;font-size:13px;text-align:center;color:#c8d8ee}
.chars{display:flex;gap:9px;margin:10px 0}
.chars img{width:46px;image-rendering:pixelated;animation:bob 1s infinite alternate;filter:drop-shadow(0 4px 5px #000)}
@keyframes bob{to{transform:translateY(-6px)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.fi{animation:fi .7s both;text-align:center}
